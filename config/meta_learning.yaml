model:
  name: "meta-llama/Llama-3.1-8B-Instruct"

data:
  path: "HuggingFaceFW/fineweb-edu"
  subset: "sample-100BT"
  shuffle_buffer_size: 50_000

training:
  seq_len: 4096
  batch_size: 4
  grad_accum_steps: 8
  eval_batch_size: 4

  inner_steps: 15
  inner_lr: 1e-3
  inner_adaptation_dtype: bfloat16

  meta_lr: 3e-4

  train_on_reconstructed_keys: true
  xkv_layer_group_size: 4
  xkv_svd_backend: cholqr

  use_residual: false

  num_meta_epochs: 1000
  log_interval: 10
  batches_per_epoch: 200

  eval_interval: 20
  eval_target_cr: 4.0
  eval_ruler: true
  eval_ruler_samples: 20
  eval_ruler_tasks: ["ruler_niah3", "niah_multikey_3"]
  eval_longbench: false
  eval_longbench_samples: 10
  eval_longbench_tasks: null

wandb:
  enabled: true
  project: gist_vs_details
  entity: mixture_of_titans
