model:
  name: "meta-llama/Llama-3.1-8B-Instruct"

training:
  seq_len: 4096
  batch_size: 1 
  inner_steps: 1
  meta_lr: 3e-4
  inner_lr: 3e-2
  learn_inner_lr: true
  learn_target_perc: true
  target_perc: 75.0 # initial value
  tau: 0.01 # soft sigmoid temperature        
  lambda_compression: 0.1 # penalises low target_perc
  mlp_num_layers: 2
  mlp_hidden_factor: 4
  num_meta_epochs: 100
  loss_func: "mse"
  grad_accum_steps: 32  # accumulate gradients over N tasks before each optimizer step
  log_interval: 10  # log metrics every N batches
  batches_per_epoch: 200
  eval_ruler: true # evaluate RULER benchmark at end of each epoch
  eval_ruler_samples: 15
  un_rope: true # undo RoPE on keys before MLP training/inference
  rope_theta: 500000.0 # RoPE theta used to recompute cos/sin
  inner_optimizer: "sgd" # inner loop optimizer: "sgd" or "adam"
  inner_adam_beta1: 0.9
  inner_adam_beta2: 0.999
  inner_adam_eps: 1.0e-8

wandb:
  enabled: true
  project: "gist_vs_details"
