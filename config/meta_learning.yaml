model:
  name: "mistralai/Mistral-7B-Instruct-v0.3"

data:
  path: "HuggingFaceFW/fineweb-edu"
  subset: "sample-100BT"
  shuffle_buffer_size: 50_000

training:
  seq_len: 4096
  batch_size: 1
  grad_accum_steps: 8
  eval_batch_size: 1

  inner_steps: 10
  inner_lr: 1e-3
  inner_adaptation_dtype: bfloat16
  learn_inner_lr: false
  inner_lr_min: 0.0
  inner_lr_max: 1e-2

  meta_lr: 3e-4 # learn one lr per transformer-layer MLP
  meta_loss_post_residual: false

  use_residual: false
  per_head_residual: false

  num_meta_epochs: 1000
  log_interval: 10
  batches_per_epoch: 200

  eval_interval: 20
  eval_target_cr: 4.0
  eval_ruler: true
  eval_ruler_samples: 10
  eval_longbench: true
  eval_longbench_samples: 10

wandb:
  enabled: true
  project: "gist_vs_details"
